[workspace]
resolver = "2"
members = [
    "crates/nomad-core",
    "crates/nomad-net",
    "crates/nomad-html",
    "crates/nomad-style",
    "crates/nomad-layout",
    "crates/nomad-js",
    "crates/nomad-render",
    "bindings/c-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yourusername/nomad-web-engine"
authors = ["Nomad Web Engine Contributors"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
